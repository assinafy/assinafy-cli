name: Sandbox contract

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  # Called by release.yml so no version ships without passing against the live API.
  workflow_call:
    inputs:
      ref:
        description: Commit-ish to verify; defaults to the triggering ref
        required: false
        type: string

permissions:
  contents: read

# Every run isolates its mutations in a disposable workspace, so a release gate
# never has to queue behind (or be cancelled by) the weekly contract run.
concurrency:
  group: assinafy-sandbox-contract-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sandbox

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify current production API contract
        run: |
          npm run docs:api
          git diff --exit-code -- docs/api-reference.md docs/api-operations.json

      - name: Exercise sandbox SDK lifecycle
        if: ${{ !cancelled() }}
        env:
          ASSINAFY_API_KEY: ${{ secrets.ASSINAFY_SANDBOX_API_KEY }}
          ASSINAFY_ACCOUNT_ID: ${{ secrets.ASSINAFY_SANDBOX_ACCOUNT_ID }}
          ASSINAFY_SANDBOX_BASE_URL: https://sandbox.assinafy.com.br/v1
          ASSINAFY_SANDBOX_REQUIRED: '1'
          ASSINAFY_TEST_EMAIL: ${{ secrets.ASSINAFY_SANDBOX_TEST_EMAIL }}
          ASSINAFY_TEST_EMAIL_ALT: ${{ secrets.ASSINAFY_SANDBOX_TEST_EMAIL_ALT }}
        run: npm run test:sandbox

      - name: Exercise bundled CLI
        env:
          ASSINAFY_API_KEY: ${{ secrets.ASSINAFY_SANDBOX_API_KEY }}
          ASSINAFY_ACCOUNT_ID: ${{ secrets.ASSINAFY_SANDBOX_ACCOUNT_ID }}
          ASSINAFY_BASE_URL: https://sandbox.assinafy.com.br/v1
        run: node dist/cli.cjs --quiet --json documents statuses
