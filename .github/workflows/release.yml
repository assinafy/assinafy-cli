name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish or resume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      is-prerelease: ${{ steps.release-tag.outputs.is-prerelease }}
      release-tag: ${{ steps.release-tag.outputs.tag }}

    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="$PUSH_TAG"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version prefixed with v" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          version_without_build="${tag%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            printf 'is-prerelease=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'is-prerelease=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release-tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v${version}" ]; then
            echo "Release tag must be v${version}" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag does not exist: $RELEASE_TAG" >&2
            exit 1
          fi
          if [ "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" != "$(git rev-parse HEAD)" ]; then
            echo "Checked-out commit does not match tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]; then
            echo "Release tags must be annotated or signed" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "The protected main branch was not fetched" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Release commit must be reachable from main" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify generated files are up to date
        run: |
          node scripts/gen-docs.mjs
          npm run notices
          git diff --exit-code -- docs/
          git diff --exit-code -- THIRD_PARTY_NOTICES.md
          test -z "$(git ls-files --others --exclude-standard docs/)"

      - name: Verify API reference and release helpers
        run: |
          npm run verify:api-docs
          node scripts/semver-greater.mjs 2.0.0 1.99.99
          node scripts/semver-greater.mjs 2.0.0-rc.2 2.0.0-rc.1
          if node scripts/semver-greater.mjs 2.0.0-rc.1 2.0.0; then exit 1; fi
          if node scripts/semver-greater.mjs 2.0.0 2.0.0; then exit 1; fi

      - name: Verify installer syntax
        run: |
          bash -n install.sh
          pwsh -NoLogo -NoProfile -Command '[scriptblock]::Create((Get-Content -Raw install.ps1)) | Out-Null'

      - name: Package release assets
        run: npm run pack:release

      - name: Validate release archive layouts
        run: |
          source ./install.sh
          setup_colors
          for archive in dist/release/assinafy-*.tar.gz; do
            target="${archive##*/assinafy-}"
            validate_archive "$archive" "${target%.tar.gz}"
          done

      - name: Verify final rebuilt bundle
        run: npm run verify:bundle

      - name: Verify reproducible release archives
        run: |
          cp dist/release/SHA256SUMS "$RUNNER_TEMP/SHA256SUMS.first"
          node scripts/package-release.mjs
          cmp "$RUNNER_TEMP/SHA256SUMS.first" dist/release/SHA256SUMS

      - name: Verify release checksums
        run: shasum -a 256 -c SHA256SUMS
        working-directory: dist/release

      - name: Pack npm package
        run: |
          mkdir -p dist/publish
          npm pack --ignore-scripts --pack-destination dist/publish
          test "$(find dist/publish -maxdepth 1 -name '*.tgz' -type f | wc -l | tr -d ' ')" = 1

      - name: Prepare verified release payload
        run: |
          test "$(find dist/release -maxdepth 1 -type f | wc -l | tr -d ' ')" = 7
          tar -cf release-payload.tar -C dist release publish -C "$GITHUB_WORKSPACE" scripts/semver-greater.mjs

      - name: Upload verified release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-payload
          path: release-payload.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download verified release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-payload

      - name: Extract verified release payload
        run: |
          mkdir -p dist
          tar -xf release-payload.tar -C dist
          test -f dist/release/SHA256SUMS
          test -f dist/scripts/semver-greater.mjs
          test "$(find dist/publish -maxdepth 1 -name '*.tgz' -type f | wc -l | tr -d ' ')" = 1

      - name: Setup Node for npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Refuse concurrent release publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh run list --workflow release.yml --limit 100 --json databaseId,status)"
          other_run="$(jq -r --argjson current "$GITHUB_RUN_ID" '[.[] | select(.status != "completed" and .databaseId != $current)][0].databaseId // empty' <<<"$runs")"
          if [ -n "$other_run" ]; then
            echo "Another release workflow is active ($other_run); retry this tag after it completes" >&2
            exit 1
          fi

      - name: Create or verify draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.verify.outputs.is-prerelease }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            args=("$RELEASE_TAG" --draft --verify-tag --generate-notes --title "$RELEASE_TAG")
            if [ "$IS_PRERELEASE" = "true" ]; then args+=(--prerelease); fi
            gh release create "${args[@]}"
          fi
          release_json="$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease)"
          release_is_draft="$(jq -r '.isDraft' <<<"$release_json")"
          release_is_prerelease="$(jq -r '.isPrerelease' <<<"$release_json")"
          if [ "$release_is_prerelease" != "$IS_PRERELEASE" ]; then
            echo "Existing GitHub release prerelease state does not match its tag" >&2
            exit 1
          fi
          printf 'is-draft=%s\n' "$release_is_draft" >> "$GITHUB_OUTPUT"

      - name: Upload or verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          IS_DRAFT: ${{ steps.release.outputs.is-draft }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
        run: |
          mapfile -t local_assets < <(find dist/release -maxdepth 1 -type f -print | sort)
          remote_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          local_names="$(printf '%s\n' "${local_assets[@]##*/}")"
          while IFS= read -r remote_name; do
            if [ -n "$remote_name" ] && ! grep -Fxq "$remote_name" <<<"$local_names"; then
              echo "Existing release contains an unexpected asset: $remote_name" >&2
              exit 1
            fi
          done <<<"$remote_assets"
          remote_dir="$(mktemp -d)"
          missing_assets=()
          for asset in "${local_assets[@]}"; do
            name="$(basename "$asset")"
            if grep -Fxq "$name" <<<"$remote_assets"; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$remote_dir"
              if ! cmp -s "$asset" "$remote_dir/$name"; then
                echo "Existing release asset differs from the verified build: $name" >&2
                exit 1
              fi
            else
              missing_assets+=("$asset")
            fi
          done

          if [ "$IS_DRAFT" != "true" ]; then
            if [ "${#missing_assets[@]}" -ne 0 ]; then
              echo "Published release is missing required assets and will not be modified" >&2
              exit 1
            fi
            exit 0
          fi

          if [ "${#missing_assets[@]}" -eq 0 ]; then
            echo "All release assets are already present"
            exit 0
          fi
          gh release upload "$RELEASE_TAG" "${missing_assets[@]}"

      - name: Publish npm package
        env:
          IS_PRERELEASE: ${{ needs.verify.outputs.is-prerelease }}
        run: |
          package_file="$(find dist/publish -maxdepth 1 -name '*.tgz' -type f -print)"
          tar -xOf "$package_file" package/package.json > package.json
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          local_integrity="$(node -e "const fs=require('fs'),crypto=require('crypto'); process.stdout.write('sha512-'+crypto.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$package_file")"
          if npm view "${package}@${version}" version >/dev/null 2>&1; then
            remote_integrity="$(npm view "${package}@${version}" dist.integrity)"
            if [ "$remote_integrity" != "$local_integrity" ]; then
              echo "Existing npm package differs from the verified build" >&2
              exit 1
            fi
            echo "${package}@${version} is already published to npm"
          else
            npm_tag="latest"
            if [ "$IS_PRERELEASE" = "true" ]; then npm_tag="next"; fi
            tags_error="$(mktemp)"
            if ! dist_tags="$(npm view "$package" dist-tags --json 2>"$tags_error")"; then
              if grep -q E404 "$tags_error"; then
                dist_tags='{}'
              else
                echo "Unable to read npm distribution tags" >&2
                exit 1
              fi
            fi
            current="$(node -e "const t=JSON.parse(require('fs').readFileSync(0));process.stdout.write(t[process.argv[1]]||'')" "$npm_tag" <<<"$dist_tags")"
            publish_tag="$npm_tag"
            if [ -n "$current" ] && ! node dist/scripts/semver-greater.mjs "$version" "$current"; then
              publish_tag="backfill-$(tr '.+' '--' <<<"$version")"
            fi
            npm publish "$package_file" --access public --tag "$publish_tag"
          fi

      # Re-point the .npmrc at GitHub Packages and publish the same build there.
      - name: Configure npm for GitHub Packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://npm.pkg.github.com
          scope: '@assinafy'
          package-manager-cache: false

      - name: Publish to GitHub Packages
        env:
          IS_PRERELEASE: ${{ needs.verify.outputs.is-prerelease }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          package_file="$(find dist/publish -maxdepth 1 -name '*.tgz' -type f -print)"
          registry="https://npm.pkg.github.com"
          local_integrity="$(node -e "const fs=require('fs'),crypto=require('crypto'); process.stdout.write('sha512-'+crypto.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$package_file")"
          if npm view "${package}@${version}" version --registry="$registry" >/dev/null 2>&1; then
            remote_integrity="$(npm view "${package}@${version}" dist.integrity --registry="$registry")"
            if [ "$remote_integrity" != "$local_integrity" ]; then
              echo "Existing GitHub package differs from the verified build" >&2
              exit 1
            fi
            echo "${package}@${version} is already published to GitHub Packages"
          else
            npm_tag="latest"
            if [ "$IS_PRERELEASE" = "true" ]; then npm_tag="next"; fi
            tags_error="$(mktemp)"
            if ! dist_tags="$(npm view "$package" dist-tags --json --registry="$registry" 2>"$tags_error")"; then
              if grep -q E404 "$tags_error"; then
                dist_tags='{}'
              else
                echo "Unable to read GitHub Packages distribution tags" >&2
                exit 1
              fi
            fi
            current="$(node -e "const t=JSON.parse(require('fs').readFileSync(0));process.stdout.write(t[process.argv[1]]||'')" "$npm_tag" <<<"$dist_tags")"
            publish_tag="$npm_tag"
            if [ -n "$current" ] && ! node dist/scripts/semver-greater.mjs "$version" "$current"; then
              publish_tag="backfill-$(tr '.+' '--' <<<"$version")"
            fi
            npm publish "$package_file" --access public --tag "$publish_tag" --registry="$registry"
          fi

      - name: Publish GitHub release
        if: steps.release.outputs.is-draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.verify.outputs.is-prerelease }}
          RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          else
            latest_tag="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
            latest=false
            if [ -z "$latest_tag" ] || node dist/scripts/semver-greater.mjs "${RELEASE_TAG#v}" "${latest_tag#v}"; then
              latest=true
            fi
            gh release edit "$RELEASE_TAG" --draft=false --latest="$latest"
          fi
